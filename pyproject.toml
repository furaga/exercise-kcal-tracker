[project]
name = "health-food-lookup"
version = "0.1.0"
description = "Small CLI for probing food nutrition databases by name or barcode."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
food-lookup = "food_lookup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["food_lookup.py"]
