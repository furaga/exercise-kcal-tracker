<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#16433d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Training Log">
    <title>Training Log</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.svg">
    <link rel="stylesheet" href="./styles.css?v=53">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Training Log</p>
          <h1>今日の記録</h1>
        </div>
        <div class="top-actions">
          <div class="date-badge" id="todayBadge" aria-label="今日の日付"></div>
          <div class="account-chip hidden" id="authIdentity" title="ログイン中のアカウント"></div>
          <button class="login-button" id="googleSignInButton" type="button">ログイン</button>
          <button class="login-button hidden" id="signOutButton" type="button">ログアウト</button>
        </div>
      </header>
      <p class="visually-hidden" id="authStatus" aria-live="polite">未ログイン: この端末内に保存します。</p>

      <section class="summary-band" aria-labelledby="summaryTitle">
        <div class="summary-main-card">
          <div class="summary-title-row">
            <h2 id="summaryTitle">今週の消費カロリー</h2>
          </div>
          <div class="summary-total">
            <strong id="weekCalories">0</strong>
            <span>kcal</span>
            <em id="weekProgress">0%</em>
          </div>
          <div class="week-chart" id="weekChart" aria-label="今週と先週の消費カロリー推移"></div>
          <div class="chart-legend" aria-hidden="true">
            <span><i class="legend-current"></i>今週</span>
            <span><i class="legend-previous"></i>先週</span>
          </div>
        </div>

        <div class="summary-grid" aria-label="消費カロリーの概要">
          <div class="metric-card">
            <small>今日</small>
            <span><b id="todayCalories">0</b> kcal</span>
          </div>
          <div class="metric-card">
            <small>今月</small>
            <span><b id="monthCalories">0</b> kcal</span>
          </div>
          <div class="metric-card">
            <small>累計</small>
            <span><b id="allCalories">0</b> kcal</span>
          </div>
          <div class="metric-card">
            <small>連続</small>
            <span><b id="loggedDays">0</b> 日</span>
          </div>
        </div>
      </section>

      <section class="panel entry-panel" aria-labelledby="entryTitle">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Input</p>
            <h2 id="entryTitle">運動を入力</h2>
          </div>
          <div class="entry-heading-actions">
            <input class="date-input" id="entryDate" type="date" aria-label="記録日">
          </div>
        </div>

        <div class="mode-row" role="tablist" aria-label="運動タイプ">
          <button class="mode-button active" id="cardioTab" type="button" role="tab" aria-selected="true" data-mode="cardio">有酸素</button>
          <button class="mode-button" id="strengthTab" type="button" role="tab" aria-selected="false" data-mode="strength">筋トレ</button>
        </div>

        <form id="cardioForm" class="exercise-form" aria-labelledby="cardioTab">
          <div class="form-grid cardio-grid">
            <div class="exercise-select-row">
              <label>
                <span>種目</span>
                <select id="cardioName"></select>
              </label>
              <button class="secondary-button compact ghost copy-button" id="copyLastCardioButton" type="button" title="選択中の日付以前の同じ種目をコピー">前回コピー</button>
            </div>
            <div class="stepper-field">
              <span>分数</span>
              <div class="number-stepper">
                <button id="cardioMinus" type="button" aria-label="分数を減らす">−</button>
                <input id="cardioMinutes" type="number" min="1" max="600" step="1" inputmode="numeric" placeholder="30">
                <button id="cardioPlus" type="button" aria-label="分数を増やす">＋</button>
              </div>
            </div>
          </div>

          <div class="quick-minutes" aria-label="分数のショートカット">
            <button type="button" data-cardio-minutes="10">10分</button>
            <button type="button" data-cardio-minutes="20">20分</button>
            <button type="button" data-cardio-minutes="30">30分</button>
            <button type="button" data-cardio-minutes="45">45分</button>
          </div>

          <div class="preview-strip" aria-label="有酸素の概算">
            <div>
              <span id="cardioRate">0</span>
              <small>kcal/分</small>
            </div>
            <div>
              <span id="cardioPreviewMinutes">0</span>
              <small>分</small>
            </div>
            <div class="preview-output">
              <span id="cardioCalories">0</span>
              <small>消費kcal</small>
            </div>
          </div>

          <details class="rate-disclosure">
            <summary>消費カロリー係数</summary>
            <p class="rate-note" id="cardioRateNote"></p>
          </details>
          <button class="primary-button" type="submit">保存・<span id="cardioSaveCalories">0 kcal</span></button>
        </form>

        <form id="strengthForm" class="exercise-form hidden" aria-labelledby="strengthTab">
          <div class="form-grid">
            <div class="exercise-select-row">
              <label>
                <span>種目</span>
                <select id="strengthName"></select>
              </label>
              <button class="secondary-button compact ghost copy-button" id="copyLastStrengthButton" type="button" title="選択中の日付以前の同じ種目をコピー">前回コピー</button>
            </div>
            <label class="duration-field">
              <span>所要時間</span>
              <input id="strengthDuration" type="number" min="1" max="240" step="1" inputmode="numeric" placeholder="自動">
            </label>
          </div>

          <div class="set-list" id="setList" aria-label="セット一覧"></div>

          <div class="set-actions">
            <button class="secondary-button" id="addSetButton" type="button">セット追加</button>
          </div>

          <div class="preview-strip" aria-label="筋トレの概算">
            <div>
              <span id="strengthReps">0</span>
              <small>合計回</small>
            </div>
            <div>
              <span id="strengthMinutes">0</span>
              <small>ボリューム</small>
            </div>
            <div class="preview-output">
              <span id="strengthCalories">0</span>
              <small>消費</small>
            </div>
          </div>

          <details class="rate-disclosure">
            <summary>消費カロリー係数</summary>
            <p class="rate-note" id="strengthRateNote"></p>
          </details>
          <button class="primary-button" type="submit">保存・<span id="strengthSaveCalories">0 kcal</span></button>
        </form>

        <p class="status" id="statusText" role="status"></p>
      </section>

      <section class="panel comparison-panel" aria-labelledby="comparisonTitle">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Compare</p>
            <h2 id="comparisonTitle">vs 先週（種目別）</h2>
          </div>
          <span class="section-meta">今週 / 先週</span>
        </div>
        <p class="panel-subtitle">漸進性過負荷の追跡</p>
        <div class="comparison-list" id="comparisonList"></div>
      </section>

      <section class="panel history-panel" aria-labelledby="historyTitle">
        <div class="section-heading">
          <div>
            <p class="section-kicker">History</p>
            <h2 id="historyTitle">運動履歴</h2>
          </div>
          <div class="history-actions">
            <button class="secondary-button compact" id="exportButton" type="button">Export</button>
          </div>
        </div>
        <div class="history-tabs" id="historyTabs" aria-label="日付選択"></div>
        <div class="history-list" id="historyList"></div>
      </section>

      <section class="panel weight-panel" aria-labelledby="weightTitle">
        <div class="subtle-weight">
          <label>
            <span id="weightTitle">体重メモ</span>
            <span class="unit-input">
              <input id="bodyWeight" type="number" min="20" max="250" step="0.1" inputmode="decimal" placeholder="68.4" aria-label="体重 kg">
              <span>kg</span>
            </span>
          </label>
          <button class="primary-button compact-save" id="saveWeightButton" type="button">保存</button>
        </div>
        <p class="status weight-status" id="weightStatus" role="status"></p>
      </section>

      <details class="panel settings-panel" aria-labelledby="settingsTitle">
        <summary class="settings-summary">
          <div>
            <p class="section-kicker">Rates</p>
            <h2 id="settingsTitle">消費カロリー係数</h2>
          </div>
          <span class="settings-chevron" aria-hidden="true">⌄</span>
        </summary>
        <div class="settings-body">
          <button class="secondary-button compact" id="resetRatesButton" type="button">初期値</button>
          <div class="rate-editor" id="rateEditor"></div>
        </div>
      </details>

    </main>

    <script src="./vendor/supabase.js"></script>
    <script src="./app.js?v=53" defer></script>
  </body>
</html>
